<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bento Grid Gallery</title>
    <meta name="description"
        content="A stunning Formula 1 and motorsport photo gallery built in a bento-style grid layout using Bootstrap.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body style="background-color: #0d0d0d;">

    <!-- Bento Grid -->
    <div class="container mt-4">
        <div class="row gx-2 gy-2">

            <!-- LEFT COLUMN (col-9) -->
            <div class="col-9 d-flex flex-column gap-2">

                <!-- Row 1 -->
                <div class="row gx-2">
                    <div class="col-8">
                        <div class="card border-0 overflow-hidden" style="height: 340px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/14079604/pexels-photo-14079604.jpeg?auto=compress&cs=tinysrgb&w=1200"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card border-0 overflow-hidden position-relative"
                            style="height: 340px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/35219022/pexels-photo-35219022.jpeg?auto=compress&cs=tinysrgb&w=800"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="row gx-2">
                    <div class="col-4 d-flex flex-column gap-2">
                        <div class="card border-0 overflow-hidden" style="height: 180px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/13641535/pexels-photo-13641535.jpeg?auto=compress&cs=tinysrgb&w=800"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="card border-0 overflow-hidden flex-grow-1"
                            style="min-height: 120px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/17555047/pexels-photo-17555047.jpeg?auto=compress&cs=tinysrgb&w=800"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-5 d-flex flex-column">
                        <div class="card border-0 overflow-hidden flex-grow-1"
                            style="min-height: 340px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/28680795/pexels-photo-28680795.jpeg?auto=compress&cs=tinysrgb&w=1000"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-3 d-flex flex-column gap-2">
                        <div class="card border-0 overflow-hidden" style="height: 160px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/40268178/pexels-photo-40268178.jpeg?auto=compress&cs=tinysrgb&w=800"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="card border-0 overflow-hidden flex-grow-1"
                            style="min-height: 120px; border-radius: 16px;">
                            <img src="https://images.pexels.com/photos/12795/pexels-photo-12795.jpeg?auto=compress&cs=tinysrgb&w=800"
                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN (col-3) -->
            <div class="col-3 d-flex flex-column gap-2">
                <div class="card border-0 overflow-hidden" style="height: 380px; border-radius: 16px;">
                    <img src="https://images.pexels.com/photos/30054754/pexels-photo-30054754.jpeg?auto=compress&cs=tinysrgb&w=800"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="card border-0 overflow-hidden flex-grow-1" style="min-height: 200px; border-radius: 16px;">
                    <img src="https://images.pexels.com/photos/33619325/pexels-photo-33619325.jpeg?auto=compress&cs=tinysrgb&w=800"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                </div>

            </div>

        </div>

        <!-- Bottom Row -->
        <div class="row gx-2 mt-2">
            <div class="col-5">
                <div class="card border-0 overflow-hidden" style="height: 230px; border-radius: 16px;">
                    <img src="https://images.pexels.com/photos/29252129/pexels-photo-29252129.jpeg?auto=compress&cs=tinysrgb&w=1000"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>
            <div class="col-7">
                <div class="card border-0 overflow-hidden" style="height: 230px; border-radius: 16px;">
                    <img src="https://images.pexels.com/photos/38184115/pexels-photo-38184115.jpeg?auto=compress&cs=tinysrgb&w=1000"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>
        </div>

    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
