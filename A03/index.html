<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinobi Database — Characters</title>
  <meta name="description" content="Browse Naruto Shippuden characters in the Shinobi Database archive.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <link rel="stylesheet" href="css/shinobi.css">
</head>

<body>

  <div id="nav-placeholder"></div>

  <header class="page-header" aria-labelledby="page-title">
    <div class="container">
      <p class="page-eyebrow">Naruto Franchise Historical Archive</p>
      <h1 id="page-title">Characters</h1>
      <p class="page-lead">Browse shinobi, kage, and figures from across the Naruto universe.</p>
    </div>
  </header>

  <main class="py-4">
    <div class="container">

      <!-- Search bar -->
      <div class="search-bar mb-4">
        <form id="search-form" role="search" aria-label="Search characters">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-sm">
              <label for="search-input" class="form-label">Search by name</label>
              <input type="search" id="search-input" class="form-control" placeholder="e.g. Naruto, Sasuke, Kakashi…"
                autocomplete="off" maxlength="100">
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-shinobi">Search</button>
            </div>
            <div class="col-auto">
              <button type="button" id="clear-btn" class="btn btn-outline-secondary">Clear</button>
            </div>
            <div class="col-auto d-flex align-items-end">
              <!-- Archive info popover -->
              <button type="button" id="info-btn" class="btn btn-link p-0 info-btn" aria-label="Archive information">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"
                  aria-hidden="true" focusable="false">
                  <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                  <path
                    d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Results summary -->
      <p id="results-summary" class="text-muted-archive mb-3" aria-live="polite" aria-atomic="true"></p>

      <!-- Card grid -->
      <div id="card-grid" class="row g-3 row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5"></div>

      <!-- Pagination -->
      <div id="pagination" class="mt-4"></div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Archive info popover — pure JS, no Bootstrap Popover dependency -->
  <script>
    (function () {
      const btn = document.getElementById('info-btn');
      if (!btn) return;

      // Build the floating panel
      const panel = document.createElement('div');
      panel.id = 'info-panel';
      panel.setAttribute('role', 'tooltip');
      panel.setAttribute('aria-live', 'polite');
      panel.hidden = true;
      panel.innerHTML =
        '<strong>Archive Notice</strong>' +
        '<p style="margin:0.4rem 0 0">Data is sourced live from the ' +
        '<a href="https://api-dattebayo.vercel.app/docs" target="_blank" rel="noopener noreferrer">Dattebayo Naruto API</a>. ' +
        'Records may take a moment to load on first access.</p>';
      document.body.appendChild(panel);

      // Position the panel above the button
      function positionPanel() {
        const br = btn.getBoundingClientRect();
        const pr = panel.getBoundingClientRect();
        panel.style.left = (br.left + br.width / 2 - pr.width / 2 + window.scrollX) + 'px';
        panel.style.top = (br.top - pr.height - 8 + window.scrollY) + 'px';
      }

      // Toggle on button click
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!panel.hidden) {
          panel.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
          return;
        }
        panel.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        positionPanel();
      });

      // Dismiss on outside click or Escape
      document.addEventListener('click', function () {
        if (!panel.hidden) {
          panel.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !panel.hidden) {
          panel.hidden = true;
          btn.setAttribute('aria-expanded', 'false');
          btn.focus();
        }
      });
    })();
  </script>

  <script type="module" src="js/characters.js"></script>
</body>

</html>
